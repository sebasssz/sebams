<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#27272a">
  <title>Sebams · A little space to focus</title>
  <link rel="icon" href="assets/icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true"><defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-links" viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3 1-1h4l1 3 3 2 3 1v4l-3 1-2 3-1 3h-4l-1-3-3-2-3-1V8l3-1 2-3Z"/><circle cx="12" cy="11" r="3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="14" r="8"/><path d="M9 2h6m-3 0v4m0 4v5l3 2m4-12 2 2"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M4 3h16v14l-4 4H4V3Zm12 18v-4h4M8 8h8M8 12h6"/></symbol>
    <symbol id="i-habit" viewBox="0 0 24 24"><path d="M20 3c-1 12-5 18-12 15C1 14 4 6 20 3ZM6 20 16 9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L20 5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20 3 11C-2 4 7-1 12 6c5-7 14-2 9 5l-9 9Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm10-10 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M9 10v7m6-7v7"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M8 3h8m-7 0v6l-4 4v2h14v-2l-4-4V3M12 15v6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m4 19 7-7 4 4 4-5 2 2"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="m5 4-3 9v7h20v-7l-3-9H5Zm-3 9h6l2 3h4l2-3h6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="i-complete" viewBox="0 0 24 24"><path d="m3 12 4 4 9-9m-6 7 3 3 9-10"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7-11 11M10 5H4v15h15v-6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3l12 12h3m-4-4 4 4-4 4M3 18h3l12-12h3m-4-4 4 4-4 4"/></symbol>
  </defs></svg>
  <div id="background" class="background" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <header class="topbar secondary-widget">
    <div class="top-left"><div class="top-controls">
      <button id="links-open" class="quiet" aria-haspopup="dialog"><svg><use href="#i-external"/></svg><span>Links</span></button>
      <form id="search-form" class="search" role="search"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="search-input" type="search" aria-label="Search the web" placeholder="Search the web" autocomplete="off"><button id="search-provider" type="button" title="Choose search provider">Google</button></form><button id="search-commands" class="icon-button secondary-widget" type="button" aria-label="Search tasks, lists and links" title="Search Sebams · Ctrl+K"><svg aria-hidden="true"><use href="#i-search"/></svg></button></div><nav id="pinned-links" class="pinned-links" aria-label="Pinned websites" hidden></nav>
    </div>
    <button id="weather-open" class="weather quiet" aria-label="Set up weather"><svg><use href="#i-sun"/></svg><span><strong id="weather-temp">Weather</strong><small id="weather-city">Choose your city</small></span></button>
  </header>
  <main class="center">
    <div class="clock-line"><time id="clock">00:00</time><span id="period"></span></div>
    <div id="date" class="date"></div>
    <h1 id="greeting">Welcome to your space.</h1>
    <section id="daily-focus" class="daily-focus" aria-label="Daily focus">
      <p class="eyebrow" id="focus-label">WHAT IS YOUR MAIN FOCUS TODAY?</p>
      <form id="focus-form"><input id="focus-input" aria-label="Your main focus today" maxlength="300" autocomplete="off" placeholder="Make room for what matters"><button type="submit" class="icon-button" aria-label="Save daily focus"><svg><use href="#i-arrow"/></svg></button></form>
      <div id="focus-saved" hidden><button id="focus-complete" class="focus-check" aria-label="Complete daily focus"><svg><use href="#i-check"/></svg></button><span id="focus-text"></span><button id="focus-edit" class="icon-button" aria-label="Edit daily focus"><svg><use href="#i-edit"/></svg></button><button id="focus-archive" class="icon-button" aria-label="Archive daily focus"><svg><use href="#i-close"/></svg></button></div>
      <div id="focus-rollover" hidden><p>Your unfinished focus is still here.</p><button id="focus-carry">Keep for today</button><button id="focus-old-archive">Archive it</button></div>
      <p id="focus-congrats" class="focus-congrats" hidden>A little progress. A good day.</p>
    </section>
  </main>
  <div id="focus-view-bar" hidden><span>One thing at a time.</span><button id="exit-focus">Leave focus view</button></div>
  <footer class="bottom-bar secondary-widget">
    <div class="bottom-left"><button id="settings-open" class="icon-button" aria-label="Open settings"><svg><use href="#i-settings"/></svg></button><div class="scene-info-group"><button id="background-open" class="scene-info" aria-label="Choose a background"><svg class="scene-icon" aria-hidden="true"><use href="#i-image"/></svg><span id="scene-title">Alpine stillness</span><small id="scene-subtitle">A new perspective, every day</small></button><a id="photo-credit" class="photo-credit" href="https://picsum.photos/" target="_blank" rel="noopener noreferrer" hidden></a></div><button id="background-favorite" class="icon-button" aria-label="Favorite background"><svg><use href="#i-heart"/></svg></button><button id="background-next" class="icon-button" aria-label="Next background" title="Next background"><svg><use href="#i-arrow"/></svg></button></div>
    <section id="quote" class="quote" aria-label="Daily quote"><p id="quote-text"></p><div class="quote-details"><span id="quote-author"></span><button id="quote-favorite" class="icon-button small" aria-label="Favorite quote"><svg><use href="#i-heart"/></svg></button><button id="quote-open" class="text-button">Quotes</button></div></section>
    <nav class="tools" aria-label="Productivity tools"><button id="timer-open" class="quiet" aria-label="Focus timer"><svg><use href="#i-timer"/></svg><span id="timer-pill">Focus</span></button><button id="notes-open" class="icon-button" aria-label="Quick notes"><svg><use href="#i-note"/></svg></button><button id="habits-open" class="icon-button" aria-label="Daily habits"><svg><use href="#i-habit"/></svg></button><button id="tasks-open" class="quiet"><span>Tasks</span><span id="task-count" class="count">0</span></button></nav>
  </footer>
  <aside id="welcome" class="welcome" hidden aria-label="Welcome to Sebams"><img src="assets/logo.svg" alt="" width="28" height="28"><div><h2>A little space to focus.</h2><p>Welcome to Sebams. Make this moment yours.</p><form id="welcome-form"><label class="sr-only" for="welcome-name">What should we call you?</label><input id="welcome-name" maxlength="60" placeholder="Your name (optional)"><button class="primary" type="submit">Make yourself at home</button></form><button id="welcome-skip" class="text-button">Skip for now · Change anything in settings</button></div></aside>
  <dialog id="panel" aria-labelledby="panel-title"><header class="panel-heading"><div><span id="panel-kicker" class="eyebrow">YOUR SPACE</span><h2 id="panel-title"></h2></div><button id="panel-close" class="icon-button" aria-label="Close panel"><svg><use href="#i-close"/></svg></button></header><div id="panel-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden><span id="toast-message"></span><button id="toast-action" hidden></button><button id="toast-close" class="icon-button small" aria-label="Dismiss message"><svg><use href="#i-close"/></svg></button></div>
</body>
</html>
